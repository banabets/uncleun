<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uncle's Room</title>
<link rel="icon" href="../public/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2A1A14; --cream: #FFF6E6; --red: #EF3B36; --gold: #F6C431; --mint: #A3CFC2; --pink: #FF9EC1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #1b1420; color: var(--ink); font-family: 'Fredoka', sans-serif; -webkit-tap-highlight-color: transparent; }

  /* ---------- the room: new6.webp as a framed, tilting diorama ---------- */
  #ambient { position: fixed; inset: -60px; background: url(../public/new6.webp) center / cover; filter: blur(40px) brightness(.45) saturate(1.2); transition: filter .6s; }
  #view { position: fixed; inset: 0; overflow: hidden; perspective: 1600px; touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1254px; height: 1254px; transform-origin: 0 0; }
  #tilt { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .15s ease-out; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 8px var(--ink), 0 30px 80px rgba(0,0,0,.6); }
  #room { position: absolute; inset: 0; background: url(../public/new6.webp) 0 0 / 100% 100%; will-change: transform; transform: scale(1.05); }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  #tvglow { background: radial-gradient(ellipse 260px 620px at 40px 520px, rgba(80,130,255,.45), transparent 70%); mix-blend-mode: screen; animation: tvflick 2.2s steps(5) infinite; }
  @keyframes tvflick { 20% { opacity: .7; } 40% { opacity: 1; } 60% { opacity: .82; } 80% { opacity: .95; } }
  #led { background: radial-gradient(circle 46px at 716px 683px, rgba(80,160,255,.75), transparent 70%); mix-blend-mode: screen; animation: led 1.6s ease-in-out infinite; }
  @keyframes led { 50% { opacity: .35; } }
  #lampglow { background: radial-gradient(circle 260px at 210px 200px, rgba(255,214,140,.45), transparent 70%); mix-blend-mode: screen; transition: opacity .6s; }
  #dark { background: #141a45; mix-blend-mode: multiply; opacity: 0; transition: opacity .6s; }
  .lights-off #dark { opacity: .8; } .lights-off #lampglow { opacity: 0; } .lights-off #tvglow { filter: brightness(1.8); }
  .lights-off #ambient { filter: blur(40px) brightness(.25) saturate(1.2); }

  /* hotspots: a soft glow over the real object + a pulsing pin */
  .hot { position: absolute; border-radius: 26px; cursor: pointer; transition: box-shadow .2s, background .2s; }
  .hot:hover, .hot.peek { background: rgba(255,246,230,.12); box-shadow: 0 0 0 4px rgba(246,196,49,.95), 0 0 30px 6px rgba(246,196,49,.55); }
  .pin { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); pointer-events: none; transition: transform .25s, opacity .3s; }
  .pin::after { content: ''; position: absolute; inset: -12px; border-radius: 50%; border: 4px solid var(--gold); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .pin.seen { background: var(--mint); } .pin.seen::after { animation: none; opacity: 0; }
  .hot:hover .pin { transform: scale(1.3); }

  /* ---------- HUD ---------- */
  .hud { position: fixed; z-index: 20; display: flex; gap: 10px; align-items: center; }
  .hud.tl { top: 16px; left: 16px; } .hud.tr { top: 16px; right: 16px; }
  .hud a, .hud button { font: 700 15px 'Fredoka'; color: var(--ink); text-decoration: none; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 8px 16px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  .hud button.icon { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 18px; }
  .hud a:active, .hud button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  #hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; font-family: 'Caveat'; font-size: 26px; color: var(--cream); background: rgba(42,26,20,.8); padding: 6px 20px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
  #found { position: fixed; left: 16px; bottom: 18px; z-index: 20; font: 700 14px 'Fredoka'; color: var(--cream); background: rgba(42,26,20,.8); padding: 6px 14px; border-radius: 999px; }
  #found b { color: var(--gold); }
  #tip { position: fixed; z-index: 25; pointer-events: none; font-family: 'Caveat'; font-size: 26px; color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 14px; padding: 2px 12px; box-shadow: 0 4px 0 var(--ink); transform: translate(-50%, -140%) rotate(-2deg); opacity: 0; transition: opacity .15s; white-space: nowrap; }
  #bubble { position: fixed; z-index: 24; max-width: 300px; pointer-events: none; font: 600 19px 'Fredoka'; background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 10px 16px; box-shadow: 0 5px 0 var(--ink); opacity: 0; transform: translate(-50%, -100%) scale(.6); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); }
  #bubble.on { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #bubble::after { content: ''; position: absolute; left: 30px; bottom: -14px; border: 12px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
  #toast { position: fixed; z-index: 24; right: 18px; top: 76px; width: 300px; background: rgba(250,246,240,.97); border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px; box-shadow: 0 5px 0 var(--ink); transform: translateX(130%); transition: transform .4s cubic-bezier(.3,1.4,.5,1); cursor: pointer; }
  #toast.on { transform: none; }
  #toast small { display: block; font-weight: 700; color: #8a7a6a; font-size: 13px; }
  #toast div { font-weight: 600; font-size: 16px; }
  .crumb { position: fixed; z-index: 26; pointer-events: none; font-size: 26px; animation: crumb 900ms ease-out forwards; }
  @keyframes crumb { to { transform: translate(var(--dx), 120px) rotate(var(--r)); opacity: 0; } }

  /* ---------- modals ---------- */
  #modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(27,20,32,.55); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #modal.on { opacity: 1; pointer-events: auto; }
  .card { position: relative; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--cream); border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 12px 0 var(--ink); padding: 30px 30px 26px; transform: scale(.85) rotate(-1.5deg); transition: transform .35s cubic-bezier(.3,1.5,.5,1); }
  #modal.on .card { transform: none; }
  .card .x { position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--ink); background: var(--red); color: #fff; font: 700 20px 'Fredoka'; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .card h2 { font-family: 'Bungee'; font-weight: 400; font-size: clamp(28px, 5vw, 42px); line-height: 1; margin-bottom: 4px; padding-right: 48px; }
  .card h2 .r { color: var(--red); }
  .card .hand { font-family: 'Caveat'; font-size: 26px; color: var(--red); margin-bottom: 18px; }
  .frame16 { position: relative; aspect-ratio: 16 / 9; border: 4px solid var(--ink); border-radius: 16px; overflow: hidden; background: #000; }
  .frame16 iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .soonrow { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .pill { font-family: 'Bungee'; font-size: 13px; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px; }
  .steps { display: grid; gap: 12px; }
  .step { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 10px 14px; box-shadow: 0 4px 0 var(--ink); }
  .step b { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--ink); font-family: 'Bungee'; font-size: 20px; }
  .step:nth-child(1) b { background: var(--red); color: #fff; } .step:nth-child(2) b { background: var(--gold); } .step:nth-child(3) b { background: var(--pink); }
  .step strong { font-family: 'Bungee'; font-weight: 400; font-size: 17px; display: block; }
  .ca { margin-top: 16px; display: flex; gap: 8px; align-items: center; background: var(--ink); color: var(--gold); border-radius: 14px; padding: 10px 10px 10px 16px; font-family: 'Bungee'; font-size: 13px; }
  .ca span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: 700 15px 'Fredoka'; color: var(--ink); text-decoration: none; background: var(--gold); border: 3px solid var(--ink); border-radius: 999px; padding: 8px 16px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  .btn.red { background: var(--red); color: #fff; }
  .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .press { text-align: center; font-family: 'Bungee'; font-size: 15px; color: var(--red); margin: -6px 0 14px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* tokenomics as the nutrition label on the can */
  .nutri { max-width: 380px; margin: 0 auto; background: #fff; border: 4px solid var(--ink); padding: 14px 18px; font-family: 'Fredoka'; }
  .nutri h3 { font-family: 'Bungee'; font-weight: 400; font-size: 30px; line-height: 1; border-bottom: 10px solid var(--ink); padding-bottom: 6px; }
  .nutri .serv { font-weight: 600; border-bottom: 4px solid var(--ink); padding: 6px 0; }
  .nutri .row { display: flex; justify-content: space-between; font-weight: 700; font-size: 18px; padding: 7px 0; border-bottom: 2px solid var(--ink); }
  .nutri .row span:last-child { font-family: 'Bungee'; font-weight: 400; }
  .nutri .row.big { font-size: 22px; border-bottom-width: 6px; }
  .nutri .fine { font-size: 13px; padding-top: 8px; }
  .phone { width: min(340px, 100%); margin: 0 auto; background: #1c1c1e; border-radius: 40px; padding: 14px; border: 4px solid var(--ink); }
  .phone .scr { background: #f2efe9; border-radius: 28px; padding: 16px 12px; min-height: 380px; display: flex; flex-direction: column; gap: 8px; }
  .phone .who { text-align: center; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 18px; font-size: 15px; font-weight: 500; }
  .msg.in { background: #e3ded5; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.out { background: #34c759; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .socials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
  .socials a { text-align: center; text-decoration: none; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 4px; font-weight: 700; font-size: 13px; }
  .socials a span { display: block; font-size: 22px; }

  /* ---------- the door ---------- */
  #door { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: #7a4a6a; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 30px, transparent 30px 60px); perspective: 1400px; cursor: pointer; transition: opacity .7s .5s; overflow: hidden; }
  #door.gone { opacity: 0; pointer-events: none; }
  .doorway { position: relative; width: min(340px, 62vw, 40vh); aspect-ratio: 34 / 60; background: #0c0a10; border: 10px solid #4a2a3a; border-bottom: 0; border-radius: 14px 14px 0 0; box-shadow: 0 0 0 5px var(--ink); overflow: hidden; }
  .doorway .light { position: absolute; inset: 0; background: url(../public/new6.webp) 62% 40% / auto 100%; opacity: 0; transition: opacity .6s; }
  #door.open .doorway .light { opacity: 1; }
  .slab { position: absolute; inset: 0; background: #E14B3F; border: 5px solid var(--ink); border-radius: 8px 8px 0 0; transform-origin: left center; transition: transform 1.1s cubic-bezier(.6,0,.2,1); display: grid; justify-items: center; align-content: start; padding-top: 18%; }
  #door.open .slab { transform: rotateY(-105deg); }
  .slab::before, .slab::after { content: ''; position: absolute; left: 12%; right: 12%; border: 5px solid rgba(42,26,20,.35); border-radius: 10px; }
  .slab::before { top: 50%; height: 18%; } .slab::after { top: 72%; height: 20%; }
  .slab .sign { position: relative; z-index: 1; background: var(--cream); border: 4px solid var(--ink); border-radius: 12px; padding: 10px 14px; text-align: center; transform: rotate(-4deg); box-shadow: 0 5px 0 var(--ink); }
  .slab .sign b { display: block; font-family: 'Bungee'; font-weight: 400; font-size: clamp(15px, 3.6vw, 24px); }
  .slab .sign span { font-family: 'Caveat'; font-size: clamp(16px, 3.4vw, 22px); color: var(--red); }
  .slab .knob { position: absolute; right: 9%; top: 52%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); }
  .slab .heart { position: relative; z-index: 1; margin-top: 12%; font-size: clamp(26px, 6vw, 40px); }
  .mat { width: min(380px, 70vw, 46vh); margin-top: -2px; background: #b06a4a; border: 5px solid var(--ink); border-radius: 10px; text-align: center; font-family: 'Bungee'; font-size: clamp(18px, 4vw, 26px); color: var(--cream); padding: 6px 0; box-shadow: 0 6px 0 var(--ink); }
  .knock { margin-top: 26px; font-family: 'Caveat'; font-size: clamp(26px, 5vw, 36px); color: var(--cream); text-shadow: 0 3px 0 var(--ink); text-align: center; }
  .knock small { display: block; font-family: 'Fredoka'; font-size: 15px; opacity: .8; text-shadow: none; }
  .door-wrap { display: flex; flex-direction: column; align-items: center; transition: transform 1.4s cubic-bezier(.6,0,.2,1) .6s; }
  #door.open .door-wrap { transform: scale(3.4); }
  #door.knocked .slab { animation: knockShake .12s 2; }
  @keyframes knockShake { 50% { transform: translateX(4px) rotate(.4deg); } }

  @media (max-width: 700px) { #hint { bottom: 58px; font-size: 21px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>

<div id="ambient"></div>
<div id="view"><div id="stage"><div id="tilt">
  <div id="room">
    <div class="fx" id="lampglow"></div>
    <div class="fx" id="tvglow"></div>
    <div class="fx" id="dark"></div>
    <div class="fx" id="led"></div>
    <div id="hots"></div>
  </div>
</div></div></div>

<div class="hud tl"><a href="c-heart-pajamas.html">← Back to site</a></div>
<div class="hud tr"><button class="icon" id="sndBtn" title="Sound">🔊</button></div>
<div id="hint">click the glowing dots. uncle won't mind.</div>
<div id="found">secrets found: <b id="foundN">0</b>/<span id="foundT">0</span></div>
<div id="tip"></div>
<div id="bubble"></div>
<div id="toast"><small>💬 nephew 🐣 · now</small><div id="toastMsg"></div></div>

<div id="modal"><div class="card"><button class="x" aria-label="Close">✕</button><div id="mbody"></div></div></div>

<div id="door">
  <div class="door-wrap">
    <div class="doorway">
      <div class="light"></div>
      <div class="slab">
        <div class="sign"><b>UNCLE'S ROOM</b><span>knock if pumping</span></div>
        <div class="heart">❤</div>
        <div class="knob"></div>
      </div>
    </div>
    <div class="mat">GM</div>
    <div class="knock">✊ knock knock<small>click the door</small></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

/* ================= hotspots over the real objects in new6.webp (image pixels, 1254x1254) ================= */
const HOTS = [
  // TV (the show) is off for now: { key: 'tv', x: 0, y: 20, w: 125, h: 990, px: 62, py: 420, label: '📺 watch the show' },
  { key: 'pad',      x: 612,  y: 628,  w: 216, h: 124, px: 720,  py: 640,  label: '🎮 press start (how to buy)' },
  { key: 'can',      x: 1012, y: 898,  w: 126, h: 218, px: 1075, py: 960,  label: '🥤 $UNCLE soda · nutrition facts' },
  { key: 'games',    x: 548,  y: 1040, w: 452, h: 150, px: 760,  py: 1090, label: '💿 multiplayer (socials)' },
  { key: 'lamp',     x: 112,  y: 78,   w: 200, h: 470, px: 210,  py: 165,  label: '💡 lights' },
  { key: 'remote',   x: 884,  y: 1112, w: 194, h: 90,  px: 980,  py: 1150, label: '📻 put on some jazz' },
  { key: 'chips',    x: 700,  y: 914,  w: 312, h: 150, px: 860,  py: 935,  label: '🥔 chips' },
  { key: 'pizza',    x: 1094, y: 996,  w: 160, h: 180, px: 1190, py: 1070, label: '🍕 cold pizza' },
  { key: 'figurine', x: 1104, y: 178,  w: 128, h: 128, px: 1166, py: 200,  label: '🦄 limited edition' },
  { key: 'poster',   x: 484,  y: 0,    w: 324, h: 256, px: 645,  py: 110,  label: '🕹️ UNCLE: the game' },
  { key: 'uncle',    x: 680,  y: 110,  w: 420, h: 500, px: 1040, py: 300,  label: '🦄 poke uncle' },
];
const hots = $('#hots');
HOTS.forEach(h => {
  const d = document.createElement('div'); d.className = 'hot'; d.dataset.key = h.key; d.dataset.label = h.label;
  Object.assign(d.style, { left: h.x + 'px', top: h.y + 'px', width: h.w + 'px', height: h.h + 'px' });
  const p = document.createElement('i'); p.className = 'pin'; p.style.left = (h.px - h.x) + 'px'; p.style.top = (h.py - h.y) + 'px';
  d.appendChild(p); hots.appendChild(d);
});
$('#foundT').textContent = HOTS.length;

/* ================= fit + 3D tilt / parallax ================= */
const stage = $('#stage'), tilt = $('#tilt'), room = $('#room');
let S = 1, ox = 0, oy = 0, panX = 0, maxPan = 0, mx = .5, my = .5, cx = .5, cy = .5, portrait = false;
function fit() {
  const w = innerWidth, h = innerHeight;
  portrait = w / h < .9;
  // landscape: the whole room framed with breathing space; portrait: tall and swipeable
  S = portrait ? (h * .78) / 1254 : Math.min((w - 48) / 1254, (h - 120) / 1254);
  maxPan = Math.max(0, 1254 * S - w + 32);
  if (portrait) { panX = Math.min(maxPan, Math.max(0, panX || (880 * S - w / 2))); ox = 16 - panX; }
  else { panX = 0; ox = (w - 1254 * S) / 2; }
  oy = (h - 1254 * S) / 2 + (portrait ? 0 : 14);
  stage.style.transform = `translate(${ox}px, ${oy}px) scale(${S})`;
  $('#hint').textContent = maxPan > 40 ? '← swipe to look around · tap the dots →' : "click the glowing dots. uncle won't mind.";
}
addEventListener('resize', () => { panX = 0; fit(); }); fit();
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; } });
let drag = null;
$('#view').addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') drag = { x: e.clientX, p: panX, moved: 0 }; });
addEventListener('pointermove', e => { if (drag) { const d = e.clientX - drag.x; drag.moved = Math.max(drag.moved, Math.abs(d)); panX = Math.min(maxPan, Math.max(0, drag.p - d)); fit(); } });
addEventListener('pointerup', () => setTimeout(() => drag = null, 0));
(function loop() {
  cx += (mx - cx) * .07; cy += (my - cy) * .07;
  if (!portrait) {
    tilt.style.transform = `rotateY(${(cx - .5) * 7}deg) rotateX(${(.5 - cy) * 5}deg)`;
    room.style.transform = `translate(${(.5 - cx) * 30}px, ${(.5 - cy) * 20}px) scale(1.05)`;
  }
  requestAnimationFrame(loop);
})();

/* ================= sound ================= */
let AC = null, master, muted = false;
function ac() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); return AC; }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(f, t, dur, vel, type = 'sine', dest = master) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vel, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05); }
let noiseBuf = null;
function noise() { if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return noiseBuf; }
function burst(t, f, dur, vel, type = 'bandpass') { const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noise(); fl.type = type; fl.frequency.value = f; g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random() * .5); s.stop(t + dur + .02); }
function knock() { ac(); const t = AC.currentTime; [0, .22].forEach(d => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(150, t + d); o.frequency.exponentialRampToValueAtTime(60, t + d + .12); g.gain.setValueAtTime(.7, t + d); g.gain.exponentialRampToValueAtTime(.0001, t + d + .18); o.connect(g); g.connect(master); o.start(t + d); o.stop(t + d + .2); }); }
function pop(f = 660) { if (!AC || muted) return; const t = AC.currentTime; tone(f, t, .12, .2, 'triangle'); tone(f * 1.5, t + .06, .14, .14, 'triangle'); }
function crunch() { if (!AC || muted) return; const t = AC.currentTime; for (let i = 0; i < 5; i++) burst(t + i * .045, 2500 + Math.random() * 2000, .05, .35); }
function chime() { if (!AC || muted) return; const t = AC.currentTime; [72, 76, 79, 84].forEach((m, i) => tone(mtof(m), t + i * .09, .25, .15, 'square')); }
const PROG = [{ v: [53, 57, 60, 64], w: [38, 41, 45, 47] }, { v: [53, 59, 64], w: [43, 47, 50, 49] }, { v: [52, 55, 59, 62], w: [36, 40, 43, 44] }, { v: [55, 58, 61, 64], w: [45, 49, 52, 39] }];
function startMusic() {
  ac(); const bus = AC.createGain(); bus.gain.value = .45; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3000; bus.connect(lp); lp.connect(master);
  const E8 = 60 / 84 / 2; let step = 0, next = AC.currentTime + .1;
  const cr = AC.createBufferSource(); cr.buffer = noise(); cr.loop = true; const cf = AC.createBiquadFilter(); cf.type = 'highpass'; cf.frequency.value = 3000; const cg = AC.createGain(); cg.gain.value = .025; cr.connect(cf); cf.connect(cg); cg.connect(bus); cr.start();
  const timer = setInterval(() => {
    if (next < AC.currentTime - .1) next = AC.currentTime + .05;
    while (next < AC.currentTime + .15) {
      const bar = Math.floor(step / 8) % 4, e = step % 8, ch = PROG[bar], t = next + (e % 2 ? E8 * .33 : 0);
      if (e === 0) ch.v.forEach(m => tone(mtof(m), t, 1.5, .06, 'sine', bus));
      if (e === 3 && bar % 2 === 0) ch.v.forEach(m => tone(mtof(m), t, .7, .04, 'sine', bus));
      if (e % 2 === 0) tone(mtof(ch.w[e / 2]), t, E8 * 2.2, .25, 'triangle', bus);
      if ([0, 2, 3, 4, 6, 7].includes(e)) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noise(); f.type = 'highpass'; f.frequency.value = 7000; g.gain.setValueAtTime(e % 2 ? .04 : .07, t); g.gain.exponentialRampToValueAtTime(.0001, t + .07); s.connect(f); f.connect(g); g.connect(bus); s.start(t, Math.random() * .5); s.stop(t + .08); }
      next += E8; step++;
    }
  }, 25);
  return { stop() { clearInterval(timer); bus.gain.setTargetAtTime(0, AC.currentTime, .2); cr.stop(AC.currentTime + 1); } };
}
$('#sndBtn').onclick = () => { muted = !muted; $('#sndBtn').textContent = muted ? '🔇' : '🔊'; if (master) master.gain.value = muted ? 0 : .8; };

/* ================= the door ================= */
const door = $('#door');
door.onclick = () => {

  door.classList.add('knocked'); knock();

  setTimeout(() => door.classList.add('open'), 1300);
  setTimeout(() => { door.classList.add('gone'); say("oh. it's you. grab a controller."); }, 2600);
};

document.querySelectorAll('.hot').forEach(h => {

  h.addEventListener('pointerleave', () => tip.style.opacity = 0);
  h.addEventListener('click', e => { if (drag && drag.moved > 8) return; act(h.dataset.key, h, e); });
});

function say(text) {
  const r = document.querySelector('.hot[data-key="uncle"]').getBoundingClientRect();

  bubble.style.left = Math.min(innerWidth - 170, Math.max(170, r.left + r.width * .2)) + 'px';
  bubble.style.top = Math.max(110, r.top + r.height * .45) + 'px';
  bubble.classList.add('on'); clearTimeout(bubbleT); bubbleT = setTimeout(() => bubble.classList.remove('on'), 3400);
}

  if (key === 'figurine') say('limited edition uncle. 1 of 1. not for sale. like my bags.');
  if (key === 'poster') { chime(); say('UNCLE: the game. coming never. maybe soon.'); }
}
